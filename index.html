<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>My 3D Environment</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  </head>

  <body>

    <a-scene>

      <!-- Staircase -->
      <a-entity
        gltf-model="url(assets/hayes_stairs.glb)"
        position="0 3 0"
        scale="1 1 1">
      </a-entity>

      <!-- Ground -->
      <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="20"
        height="20"
        color="#808080">
      </a-plane>

      <!-- Lighting -->
      <a-light
        type="ambient"
        color="#dfe9ff"
        intensity="0.5">

      <a-light
        type="directional"
        position="3 8 2"
        intensity="2.8"
        color="#ffdca8"
        cast-shadow="true">
      </a-light>

      <a-sphere
        position="3 8 2"
        radius="0.5"
        color="#ffdd88">
      </a-sphere>

      <!-- Camera -->
      <a-camera
        fly="true"
        id="mainCamera"
        position="0 2 5"
        look-controls
        wasd-controls="acceleration: 30; easing: 18; fly: true">
      </a-camera>

    </a-scene>

  </body>
</html>
